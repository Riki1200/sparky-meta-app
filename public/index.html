<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Storybook UI type (Fraunces headings, Nunito interface) and the child reading fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&family=Lexend:wght@400;500;600;700&family=Comic+Neue:wght@400;700&display=swap"
    />
    <style>
      /* Interface text uses Nunito. Text with its own font (inline: icons, reading text; or a
         StyleSheet fontFamily class: storybook headings) keeps it. */
      #root [class*="css-text-"]:not([style*="font-family"]):not([class*="r-fontFamily"]) {
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        background-color: #f7f1e6;
      }
    </style>
    <!-- Installable mobile web app (PWA) -->
    <meta name="description" content="A patient Meta AI reading tutor for children who read real, physical books." />
    <meta name="theme-color" content="#f7f1e6" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sparky" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Register the offline cache only on deployed builds; on localhost it would fight the dev server
      if ('serviceWorker' in navigator && !['localhost', '127.0.0.1'].includes(location.hostname)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((error) => console.warn('Service worker registration failed:', error));
        });
      }
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
